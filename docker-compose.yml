name: viernulvier-archief
services:
  db:
    container_name: viernulvier-db
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust

    volumes:
      - ./database_data:/var/lib/postgresql
    networks:
      - viernulvier-network
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: -p ${DB_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p ${DB_PORT}"]
      interval: 5s
      retries: 5
  backend:
    env_file:
      - .env
    container_name: viernulvier-backend
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./garage-credentials:/garage-credentials:ro
    networks:
      - viernulvier-network
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  frontend:
    env_file:
      - .env
    restart: always
    tty: true
    networks:
      - viernulvier-network
    container_name: viernulvier-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    environment:
     - CHOKIDAR_USEPOLLING=true

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: viernulvier-garage
    restart: always
    entrypoint: ["/garage"] 
    command: ["-c", "/etc/garage.toml", "server"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    ports:
      - "3900:3900"  # S3 API
      - "3901:3901"  # RPC
      - "3903:3903"  # Admin API
    volumes:
      - object-store:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    networks:
      - viernulvier-network
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      retries: 10
      start_period: 10s

  garage-init:
    image: docker:27-cli
    container_name: viernulvier-garage-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["tr -d '\\r' < /garage-init.sh | sh"]
    volumes:
      - ./garage-init.sh:/garage-init.sh:ro
      - ./garage-credentials:/garage-credentials
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - viernulvier-network
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"

volumes:
  database-data:
    external: false
    name: viernulvier-database-data
  object-store:
    external: false
    name: viernulvier-object-store    
   
networks:
  viernulvier-network:
    driver: bridge
