name: Build and Publish

on:
  push: # should trigger after PR goes through
    branches: 
      - "feat/test-staging-deploy"
      - "staging"
      - "main"
      
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, ARM64]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          load: true 
          tags: ghcr.io/selab-2/viernulvier-1-frontend:tmp
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/selab-2/viernulvier-1-backend:tmp
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push Frontend and Backend
        run: |
          # docker tag ghcr.io/selab-2/viernulvier-1-frontend:tmp ghcr.io/selab-2/viernulvier-1-frontend:${{ github.ref_name }}
          docker tag ghcr.io/selab-2/viernulvier-1-frontend:tmp ghcr.io/selab-2/viernulvier-1-frontend:testing
          docker tag ghcr.io/selab-2/viernulvier-1-frontend:tmp ghcr.io/selab-2/viernulvier-1-frontend:${{ github.sha }}
          docker push ghcr.io/selab-2/viernulvier-1-frontend --all-tags

          # docker tag ghcr.io/selab-2/viernulvier-1-backend:tmp ghcr.io/selab-2/viernulvier-1-backend:${{ github.ref_name }}
          docker tag ghcr.io/selab-2/viernulvier-1-backend:tmp ghcr.io/selab-2/viernulvier-1-backend:testing
          docker tag ghcr.io/selab-2/viernulvier-1-backend:tmp ghcr.io/selab-2/viernulvier-1-backend:${{ github.sha }}
          docker push ghcr.io/selab-2/viernulvier-1-backend --all-tags

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: viernulvier-archive.be
          username: selab2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2002
          script: |
            cd ~/viernulvier-server
            docker compose pull
            docker compose up -d --remove-orphans
            # clean up old dangling images to save space
            # docker image prune -f
