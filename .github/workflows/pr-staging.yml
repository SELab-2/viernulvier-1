name: staging branch code validation

on:
  pull_request:
    branches: [ "staging", "test-staging" ]

jobs:
  validate-staging:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build