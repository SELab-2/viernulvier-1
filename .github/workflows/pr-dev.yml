name: Staging Validation

on:
  pull_request:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'enhancement/**'
      - 'test-feat/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend, shared]
        include:
          - project: shared
            skip_tests: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: pnpm run lint

      - name: Test
        if: ${{ !matrix.skip_tests }}
        working-directory: ${{ matrix.project }}
        run: pnpm run test

      - name: Build
        working-directory: ${{ matrix.project }}
        run: pnpm run build
