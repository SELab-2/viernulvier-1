name: Staging Validation

on:
  pull_request:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'enhancement/**'
      - 'test-feat/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, ARM64]
    strategy:
      matrix:
        project: [frontend, backend]
    
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.project }}/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build