name: Build and Publish (Staging)

on:
  push:
    branches:
      - "staging"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Images
        run: |
          docker build -t ghcr.io/selab-2/viernulvier-1-frontend:staging -f ./frontend/Dockerfile .
          docker build -t ghcr.io/selab-2/viernulvier-1-backend:staging -f ./backend/Dockerfile .
          docker push ghcr.io/selab-2/viernulvier-1-frontend:staging
          docker push ghcr.io/selab-2/viernulvier-1-backend:staging

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: staging.viernulvier-archive.be # Assuming a different host or path
          username: selab2
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2002
          script: |
            cd ~/viernulvier-server
            docker compose pull
            docker compose up -d --remove-orphans