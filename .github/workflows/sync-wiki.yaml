name: Sync Docs to Wiki

on:
  push:
    branches:
      - staging
    paths:
      - 'DOCS/**' 

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action
        uses: actions/checkout@v4

      - name: Sync to Wiki
        uses: decathlon/wiki-page-creator-action@v1
        with:
          wiki_folder: DOCS