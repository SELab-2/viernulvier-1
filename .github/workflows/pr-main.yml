name: Main Validation

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write
  contents: read

jobs:
  enforce-policy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Staging source validation
        uses: actions/github-script@v7
        with:
          script: |
            const target = context.payload.pull_request.base.ref;
            const source = context.payload.pull_request.head.ref;

            const isInvalidMain = (target === 'main' && source !== 'staging');
            const isInvalidTestMain = (target === 'test-main' && source !== 'test-staging');

            if (isInvalidMain || isInvalidTestMain) {
              const allowedSource = target === 'main' ? 'staging' : 'test-staging';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `**PR Closed Automatically**\n\nPolicy Violation: Merges into \`${target}\` are only allowed from \`${allowedSource}\`.\nSource branch \`${source}\` is not permitted.`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                state: 'closed'
              });

              core.setFailed(`Invalid source branch: ${source}`);
            }

  validate:
    needs: enforce-policy
    runs-on: [self-hosted, linux, ARM64]
    strategy:
      matrix:
        project: [frontend, backend, shared]
        include:
          - project: shared
            skip_tests: true

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: pnpm run lint

      - name: Coverage Tests
        if: ${{ !matrix.skip_tests }}
        working-directory: ${{ matrix.project }}
        run: pnpm run coverage

      - name: Build
        working-directory: ${{ matrix.project }}
        run: pnpm run build
