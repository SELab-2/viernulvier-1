name: main branch code validation

on:
  pull_request:
    branches: [ "main", "test-main" ]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-main:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: enforce stagin source, auto close if not
        uses: actions/github-script@v7
        with:
          script: |
              const target = context.payload.pull_request.base.ref;
              const source = context.payload.pull_request.head.ref;
              
              const isInvalidMain = (target === 'main' && source !== 'staging');
              const isInvalidTestMain = (target === 'test-main' && source !== 'test-staging');

              if (isInvalidMain || isInvalidTestMain) {
                const allowedSource = target === 'main' ? 'staging' : 'test-staging';
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `**PR Closed Automatically**\n\nPolicy Violation: Merges into \`${target}\` are only allowed from \`${allowedSource}\`.\nSource branch \`${source}\` is not permitted.`
                });

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  state: 'closed'
                });
                
              } else {
                console.log(`Branch policy passed: ${source} -> ${target}`);
              }

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build